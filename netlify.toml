[build]
  publish = "."
  # Regenerates index.html, projects.html, creative.html and /work/*.html from
  # content/landing.json and content/projects.json. Runs on every deploy, so
  # anything saved in the CMS ships as static HTML.
  command = "node scripts/build.js"

[functions]
  directory = "netlify/functions"

# The admin is not content. Keep it out of search results.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
